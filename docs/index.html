<style>
  :root{
    --paper:#f4f6f3;
    --paper-2:#e9eeea;
    --surface:#ffffff;
    --ink:#18221e;
    --ink-soft:#53605a;
    --rule:#d5ddd8;

    --accent:#176b52;
    --accent-dark:#0d4f3c;
    --accent-soft:#dcece5;

    --gold:#a87927;
    --gold-soft:#f4ead6;

    --red:#a23d32;
    --red-soft:#f3e0dc;

    --shadow:0 8px 30px rgba(20,40,32,.06);
  }

  *{
    box-sizing:border-box;
  }

  html{
    scroll-behavior:smooth;
  }

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 5%, rgba(23,107,82,.055), transparent 28%),
      radial-gradient(circle at 90% 18%, rgba(168,121,39,.035), transparent 25%),
      var(--paper);

    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:17px;
    line-height:1.65;
  }

  ::selection{
    background:var(--accent-soft);
    color:var(--ink);
  }

  /* ---------- Typography ---------- */

  h1,h2,h3,h4{
    font-family:'Newsreader', serif;
    font-weight:600;
    color:var(--ink);
    letter-spacing:-0.02em;
    margin:0;
  }

  .mono{
    font-family:'IBM Plex Mono', monospace;
  }

  a{
    color:var(--accent);
    transition:color .2s ease;
  }

  a:hover{
    color:var(--accent-dark);
  }

  /* ---------- Layout ---------- */

  .wrap{
    max-width:860px;
    margin:0 auto;
    padding:0 32px;
  }

  section{
    padding:76px 0;
    position:relative;
  }

  section + section{
    border-top:1px solid var(--rule);
  }

  /* ---------- Section Labels ---------- */

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:16px;

    display:flex;
    align-items:center;
    gap:11px;
  }

  .eyebrow::before{
    content:"";
    width:28px;
    height:1px;
    background:var(--accent);
    display:inline-block;
  }

  /* ---------- Hero ---------- */

  .hero{
    padding:105px 0 78px;
    border-top:none;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.72) 0%,
        rgba(244,246,243,.2) 100%
      );

    border-bottom:1px solid var(--rule);
  }

  .hero h1{
    font-size:clamp(42px,6vw,64px);
    line-height:1.02;
    max-width:13ch;
    letter-spacing:-.035em;
  }

  .hero .dek{
    margin-top:24px;
    font-size:19px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:59ch;
  }

  /* ---------- Byline ---------- */

  .byline{
    margin-top:34px;

    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);

    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 24px;
  }

  .byline span{
    display:flex;
    align-items:center;
  }

  .byline span + span::before{
    content:"·";
    margin-right:24px;
    color:var(--rule);
  }

  .byline b{
    color:var(--ink);
    font-weight:600;
  }

  /* ---------- Hero Statistics ---------- */

  .hero-stat-row{
    margin-top:52px;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    background:rgba(255,255,255,.72);

    border:1px solid var(--rule);
    border-radius:10px;

    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .hero-stat{
    padding:25px 24px;
  }

  .hero-stat + .hero-stat{
    border-left:1px solid var(--rule);
  }

  .hero-stat .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:31px;
    font-weight:600;
    color:var(--accent);
    line-height:1;
    letter-spacing:-.04em;
  }

  .hero-stat .lbl{
    margin-top:10px;
    font-size:12.5px;
    line-height:1.45;
    color:var(--ink-soft);
  }

  /* ---------- Table of Contents ---------- */

  .toc{
    display:flex;
    flex-wrap:wrap;
    gap:9px;

    margin-top:40px;
  }

  .toc a{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;

    color:var(--ink-soft);
    text-decoration:none;

    padding:6px 10px;

    border:1px solid var(--rule);
    border-radius:4px;

    background:rgba(255,255,255,.45);

    transition:
      background .2s ease,
      color .2s ease,
      border-color .2s ease;
  }

  .toc a:hover{
    background:var(--accent-soft);
    color:var(--accent-dark);
    border-color:#bdd9ce;
  }

  /* ---------- Prose ---------- */

  p{
    margin:0 0 17px;
  }

  section h2{
    font-size:32px;
    line-height:1.15;
    margin-bottom:23px;
  }

  section h3{
    font-size:20px;
    line-height:1.25;
    margin:38px 0 13px;
    color:var(--ink);
  }

  .lede{
    font-size:19px;
    line-height:1.6;
    color:var(--ink-soft);
    margin-bottom:27px;
  }

  ul,ol{
    padding-left:24px;
    margin:0 0 18px;
  }

  li{
    margin-bottom:8px;
  }

  /* ---------- Blockquote ---------- */

  blockquote{
    margin:30px 0;
    padding:18px 24px;

    border-left:3px solid var(--accent);

    background:rgba(220,236,229,.45);

    font-family:'Newsreader', serif;
    font-style:italic;
    font-size:21px;
    line-height:1.5;

    color:var(--ink);

    border-radius:0 6px 6px 0;
  }

  /* ---------- Inline Code ---------- */

  code{
    font-family:'IBM Plex Mono', monospace;
    background:var(--paper-2);

    color:var(--accent-dark);

    padding:2px 7px;
    border-radius:4px;

    font-size:.84em;

    border:1px solid rgba(23,107,82,.08);
  }

  /* ---------- Formula ---------- */

  .formula{
    font-family:'IBM Plex Mono', monospace;

    background:
      linear-gradient(
        90deg,
        rgba(244,234,214,.75),
        rgba(255,255,255,.55)
      );

    border:1px solid #eadfc8;
    border-left:4px solid var(--gold);

    padding:17px 20px;
    margin:21px 0;

    font-size:14px;
    line-height:1.9;

    color:var(--ink);

    border-radius:0 6px 6px 0;
    box-shadow:0 4px 18px rgba(100,80,30,.035);
  }

  /* ---------- Tables ---------- */

  .tbl-wrap{
    overflow-x:auto;
    margin:24px 0;

    background:var(--surface);

    border:1px solid var(--rule);
    border-radius:7px;

    box-shadow:0 4px 18px rgba(20,40,32,.035);
  }

  table{
    width:100%;
    border-collapse:collapse;

    font-size:13.5px;
    font-family:'IBM Plex Mono', monospace;
  }

  th{
    text-align:left;

    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;

    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;

    color:var(--ink-soft);

    padding:13px 15px;

    background:#f1f4f1;

    border-bottom:2px solid var(--ink);
  }

  td{
    padding:12px 15px;
    border-bottom:1px solid var(--rule);

    white-space:nowrap;
  }

  tbody tr:last-child td{
    border-bottom:none;
  }

  tbody tr:hover td{
    background:#f7faf8;
  }

  td.num,
  th.num{
    text-align:right;
  }

  .tbl-wrap tr.highlight td{
    background:var(--accent-soft);
    font-weight:600;
  }

  .tbl-wrap tr.highlight td:first-child{
    color:var(--accent-dark);
  }

  /* ---------- Chart ---------- */

  .chart-card{
    margin:30px 0;

    padding:30px 28px 24px;

    background:
      linear-gradient(
        135deg,
        #eef3f0,
        #f7f8f6
      );

    border:1px solid var(--rule);
    border-radius:9px;

    box-shadow:var(--shadow);
  }

  .chart-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:500;

    letter-spacing:.08em;
    text-transform:uppercase;

    color:var(--ink-soft);

    margin-bottom:25px;
  }

  .bar-row{
    margin-bottom:20px;
  }

  .bar-row:last-child{
    margin-bottom:0;
  }

  .bar-label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;

    font-size:13px;
    margin-bottom:7px;
  }

  .bar-label .method{
    font-weight:500;
    color:var(--ink);
  }

  .bar-label .val{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
  }

  .bar-track{
    height:13px;

    background:#fff;

    border:1px solid var(--rule);

    position:relative;

    border-radius:2px;
    overflow:hidden;
  }

  .bar-fill{
    height:100%;
    background:#718078;

    transition:width .5s ease;
  }

  .bar-fill.strong{
    background:var(--accent);
  }

  .chart-legend{
    display:flex;
    flex-wrap:wrap;
    gap:18px;

    margin-top:23px;

    font-size:11.5px;
    color:var(--ink-soft);
  }

  .chart-legend span{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .swatch{
    width:9px;
    height:9px;
    display:inline-block;
    border-radius:2px;
  }

  /* ---------- Callouts ---------- */

  .callout{
    display:flex;
    align-items:flex-start;
    gap:15px;

    padding:19px 21px;
    margin:21px 0;

    border:1px solid var(--rule);
    border-radius:7px;

    background:rgba(255,255,255,.8);

    font-size:14.5px;
    line-height:1.6;

    box-shadow:0 3px 15px rgba(20,40,32,.025);
  }

  .callout .tag{
    font-family:'IBM Plex Mono', monospace;

    font-size:10px;
    font-weight:500;

    letter-spacing:.06em;

    padding:4px 8px;

    height:fit-content;
    white-space:nowrap;

    border-radius:3px;
  }

  .callout.limit{
    border-left:3px solid var(--gold);
  }

  .callout.limit .tag{
    background:var(--gold-soft);
    color:var(--gold);
  }

  .callout.method{
    border-left:3px solid var(--accent);
  }

  .callout.method .tag{
    background:var(--accent-soft);
    color:var(--accent);
  }

  /* ---------- Priority Cards ---------- */

  .priority-head{
    display:flex;
    align-items:center;
    gap:12px;

    margin:38px 0 15px;

    padding-bottom:10px;

    border-bottom:1px solid var(--rule);
  }

  .priority-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    flex-shrink:0;
  }

  .p1 .priority-dot{
    background:var(--red);
    box-shadow:0 0 0 4px var(--red-soft);
  }

  .p2 .priority-dot{
    background:var(--gold);
    box-shadow:0 0 0 4px var(--gold-soft);
  }

  .p3 .priority-dot{
    background:var(--ink-soft);
    box-shadow:0 0 0 4px #e5e8e6;
  }

  .priority-head h3{
    margin:0;
    font-size:21px;
  }

  /* ---------- Key / Value Grid ---------- */

  .kv-grid{
    display:grid;
    grid-template-columns:120px 1fr;

    gap:0;

    font-size:14px;

    margin:20px 0 24px;

    background:var(--surface);

    border:1px solid var(--rule);
    border-radius:7px;

    overflow:hidden;
  }

  .kv-grid dt{
    font-family:'IBM Plex Mono', monospace;

    font-size:10.5px;
    font-weight:500;

    text-transform:uppercase;
    letter-spacing:.06em;

    color:var(--ink-soft);

    padding:14px 15px;

    background:#f1f4f1;

    border-bottom:1px solid var(--rule);
  }

  .kv-grid dd{
    margin:0;

    padding:14px 17px;

    border-bottom:1px solid var(--rule);
  }

  .kv-grid dt:last-of-type,
  .kv-grid dd:last-of-type{
    border-bottom:none;
  }

  /* ---------- Footer ---------- */

  footer{
    padding:58px 0 75px;

    text-align:center;

    background:
      linear-gradient(
        180deg,
        transparent,
        rgba(233,238,234,.65)
      );

    border-top:1px solid var(--rule);
  }

  footer .mark{
    font-family:'IBM Plex Mono', monospace;

    font-size:11.5px;
    line-height:1.6;

    color:var(--ink-soft);
  }

  footer a{
    color:var(--accent);

    text-decoration:none;

    border-bottom:1px solid var(--accent-soft);
  }

  /* ---------- Responsive ---------- */

  @media (max-width:700px){

    .wrap{
      padding:0 22px;
    }

    .hero{
      padding:70px 0 55px;
    }

    .hero h1{
      font-size:42px;
    }

    .hero-stat-row{
      grid-template-columns:1fr;
    }

    .hero-stat + .hero-stat{
      border-left:none;
      border-top:1px solid var(--rule);
    }

    .byline{
      flex-direction:column;
      align-items:flex-start;
      gap:8px;
    }

    .byline span + span::before{
      display:none;
    }

    section{
      padding:55px 0;
    }

    section h2{
      font-size:28px;
    }

    .kv-grid{
      grid-template-columns:1fr;
    }

    .kv-grid dt{
      border-bottom:none;
      padding-bottom:5px;
    }

    .kv-grid dd{
      padding-top:5px;
    }

    .callout{
      flex-direction:column;
      gap:9px;
    }

    .chart-card{
      padding:24px 18px 20px;
    }
  }

  @media (max-width:480px){

    body{
      font-size:16px;
    }

    .wrap{
      padding:0 18px;
    }

    .hero h1{
      font-size:38px;
    }

    .hero .dek{
      font-size:17px;
    }

    .toc{
      gap:7px;
    }

    .toc a{
      font-size:10.5px;
    }
  }
</style>
